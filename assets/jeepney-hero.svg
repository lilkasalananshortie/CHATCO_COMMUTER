<svg viewBox="-30 10 440 145" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Authentic E-CHATCO White Metallic Body Gradient -->
        <linearGradient id="chatcoBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="55%" stop-color="#F1F5F9" />
          <stop offset="100%" stop-color="#CBD5E1" />
        </linearGradient>

        <!-- Rooftop A/C Pod Gradient -->
        <linearGradient id="rooftopAcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#94A3B8" />
        </linearGradient>

        <!-- Tinted Panoramic Windows Gradient -->
        <linearGradient id="tintedWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="50%" stop-color="#09101D" />
          <stop offset="100%" stop-color="#04070D" />
        </linearGradient>

        <!-- Signature Blue Curtains Gradient -->
        <linearGradient id="blueCurtainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1E3A8A" />
          <stop offset="70%" stop-color="#2563EB" />
          <stop offset="100%" stop-color="#1D4ED8" />
        </linearGradient>

        <!-- Forward Headlight Conical Beam (Facing Left) -->
        <linearGradient id="leftHeadlightBeamGrad" x1="100%" y1="50%" x2="0%" y2="50%">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
          <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.4" />
          <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Forward Headlight Volumetric Beam casting forward to the left -->
      <polygon
        points="40,90 -30,60 -30,126"
        fill="url(#leftHeadlightBeamGrad)"
      />

      <!-- Rear Taillight Soft Halo (Red) -->
      <circle cx="338" cy="88" r="8" fill="rgba(239, 68, 68, 0.35)" />

      <!-- 1. Rooftop A/C Unit (Long Pod with Ventilation Louvers) -->
      <path
        d="
          M 148,30
          L 152,22
          Q 156,20 162,20
          L 262,20
          Q 268,20 271,22
          L 275,30
          Z
        "
        fill="url(#rooftopAcGrad)"
        stroke="#94A3B8"
        stroke-width="1"
      />
      <!-- A/C Louver Slits -->
      <line x1="166" y1="24" x2="258" y2="24" stroke="#64748B" stroke-width="1" stroke-dasharray="6, 4" />
      <line x1="168" y1="27" x2="256" y2="27" stroke="#64748B" stroke-width="1" stroke-dasharray="6, 4" />

      <!-- 2. Main E-CHATCO Vehicle Body (Hino Poncho / Class 2 Modern PUV) -->
      <path
        d="
          M 48,114
          L 40,110
          Q 36,106 36,98
          L 36,88
          Q 37,80 40,74
          L 44,70
          L 56,38
          Q 60,30 72,30
          L 330,30
          Q 338,30 338,38
          L 338,106
          Q 338,114 330,114
          L 301,114
          A 21,21 0 0,0 259,114
          L 129,114
          A 21,21 0 0,0 87,114
          L 48,114
          Z
        "
        fill="url(#chatcoBodyGrad)"
        stroke="#94A3B8"
        stroke-width="1.2"
      />

      <!-- 3. Black Mudflaps behind wheels -->
      <rect x="129" y="108" width="4" height="15" rx="1" fill="#0F172A" />
      <rect x="301" y="108" width="4" height="15" rx="1" fill="#0F172A" />

      <!-- 4. Windows Section -->
      <!-- Slanted Front Windshield -->
      <path
        d="M 44,70 L 56,38 L 78,38 L 74,70 Z"
        fill="url(#tintedWindowGrad)"
        stroke="#1E293B"
        stroke-width="1"
      />
      <!-- Windshield Wiper -->
      <line x1="56" y1="70" x2="68" y2="52" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

      <!-- Route Number Badge '0' on Front Windshield -->
      <circle cx="64" cy="62" r="5" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="0.8" />
      <text
        x="64"
        y="62"
        fill="#FFFFFF"
        font-size="6.8"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="bold"
        text-anchor="middle"
        dominant-baseline="central"
      >0</text>

      <!-- Driver Door Window -->
      <rect
        x="80"
        y="38"
        width="34"
        height="29"
        rx="2"
        fill="url(#tintedWindowGrad)"
        stroke="#1E293B"
        stroke-width="1"
      />
      <!-- Driver Window Vent Divider -->
      <line x1="90" y1="38" x2="90" y2="67" stroke="#334155" stroke-width="1" />

      <!-- Driver Door Panel Outlines & Handle -->
      <path
        d="M 77,36 L 77,110 L 116,110 L 116,36"
        stroke="#CBD5E1"
        stroke-width="1"
        fill="none"
      />
      <rect x="110" y="74" width="4.5" height="2" rx="0.5" fill="#475569" />

      <!-- Circular CHATCO Seal Logo on Driver Door -->
      <circle cx="96.5" cy="80" r="7.5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="0.9" />
      <circle cx="96.5" cy="80" r="6" fill="#FFFFFF" />
      <circle cx="96.5" cy="80" r="4.6" fill="#1E3A8A" />
      <text
        x="96.5"
        y="91"
        fill="#1E3A8A"
        font-size="4.6"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="0.4"
      >CHATCO</text>

      <!-- Continuous Black Frame for Panoramic Passenger Windows -->
      <rect
        x="120"
        y="36"
        width="214"
        height="32"
        rx="3"
        fill="#090E17"
        stroke="#1E293B"
        stroke-width="1.2"
      />

      <!-- 3 Main Panoramic Passenger Window Bays -->
      <rect x="122" y="38" width="67" height="28" rx="1.5" fill="url(#tintedWindowGrad)" />
      <rect x="192" y="38" width="67" height="28" rx="1.5" fill="url(#tintedWindowGrad)" />
      <rect x="262" y="38" width="70" height="28" rx="1.5" fill="url(#tintedWindowGrad)" />

      <!-- Signature Blue Curtains inside passenger windows -->
      <path d="M 124,39 Q 138,48 152,39 Q 166,48 186,39 L 186,38 L 124,38 Z" fill="url(#blueCurtainGrad)" />
      <path d="M 194,39 Q 208,48 222,39 Q 236,48 256,39 L 256,38 L 194,38 Z" fill="url(#blueCurtainGrad)" />
      <path d="M 264,39 Q 280,48 296,39 Q 312,48 330,39 L 330,38 L 264,38 Z" fill="url(#blueCurtainGrad)" />

      <!-- Window Upper Sliding Transom Bar -->
      <line x1="122" y1="46" x2="332" y2="46" stroke="#334155" stroke-width="1" />

      <!-- 5. Authentic Route Text Printed on Side Body -->
      <text
        x="228"
        y="76"
        fill="#0F172A"
        font-size="5.5"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="0.4"
      >HAGONOY CALUMPIT MALOLOS MEYCAUAYAN VICE VERSA</text>

      <!-- Regulatory & Cooperative Badges Row -->
      <g transform="translate(180, 81)">
        <rect x="0" y="0" width="8" height="5" rx="0.8" fill="#DC2626" />
        <text x="4" y="2.5" fill="#FFFFFF" font-size="3" font-weight="bold" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">H</text>
        <circle cx="13" cy="2.5" r="2.5" fill="#1D4ED8" />
        <circle cx="19" cy="2.5" r="2.5" fill="#0D9488" />
        <circle cx="25" cy="2.5" r="2.5" fill="#D97706" />
        <circle cx="31" cy="2.5" r="2.5" fill="#2563EB" />
        <rect x="36" y="0" width="8" height="5" rx="0.8" fill="#1E3A8A" />
        <text x="40" y="2.5" fill="#FFFFFF" font-size="3" font-weight="bold" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif">OTC</text>
      </g>

      <!-- 6. Front Grille, Headlight Assembly & Hino Wing Emblem -->
      <rect x="37" y="84" width="25" height="4" rx="1" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8" />
      <circle cx="44" cy="86" r="2" fill="#CBD5E1" stroke="#475569" stroke-width="0.5" />
      <path
        d="M 37,89 L 58,89 L 56,97 L 37,95 Z"
        fill="#38BDF8"
        stroke="#0284C7"
        stroke-width="0.8"
      />
      <rect x="40" y="103" width="18" height="5" rx="1.5" fill="#0F172A" />

      <!-- Amber Side Indicator Light -->
      <rect x="148" y="87" width="4" height="2" rx="1" fill="#F59E0B" />

      <!-- Rear Taillight Vertical Bar -->
      <rect x="336" y="82" width="2.5" height="14" rx="1.2" fill="#EF4444" />

      <!-- Intense LED Projector Core & Amber Marker -->
      <circle cx="41" cy="92" r="3.2" fill="#E0F2FE" />
      <circle cx="150" cy="88" r="2.5" fill="#FBBF24" />

      <!-- 7. FRONT WHEEL at (108, 114) -->
      <g transform="translate(92, 98)">
        <!-- Rubber Tire -->
        <circle cx="16" cy="16" r="15" fill="#090E17" stroke="#1E293B" stroke-width="2" />
        <!-- Steel Rim -->
        <circle cx="16" cy="16" r="10.2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
        <!-- 6 Ventilation Holes -->
        <circle cx="16" cy="9.5" r="1.3" fill="#1E293B" />
        <circle cx="21.6" cy="12.75" r="1.3" fill="#1E293B" />
        <circle cx="21.6" cy="19.25" r="1.3" fill="#1E293B" />
        <circle cx="16" cy="22.5" r="1.3" fill="#1E293B" />
        <circle cx="10.4" cy="19.25" r="1.3" fill="#1E293B" />
        <circle cx="10.4" cy="12.75" r="1.3" fill="#1E293B" />
        <!-- Central Hub -->
        <circle cx="16" cy="16" r="4.2" fill="#0F172A" stroke="#475569" stroke-width="0.8" />
        <circle cx="16" cy="16" r="1.5" fill="#38BDF8" />
      </g>

      <!-- 8. REAR WHEEL at (280, 114) -->
      <g transform="translate(264, 98)">
        <!-- Rubber Tire -->
        <circle cx="16" cy="16" r="15" fill="#090E17" stroke="#1E293B" stroke-width="2" />
        <!-- Steel Rim -->
        <circle cx="16" cy="16" r="10.2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
        <!-- 6 Ventilation Holes -->
        <circle cx="16" cy="9.5" r="1.3" fill="#1E293B" />
        <circle cx="21.6" cy="12.75" r="1.3" fill="#1E293B" />
        <circle cx="21.6" cy="19.25" r="1.3" fill="#1E293B" />
        <circle cx="16" cy="22.5" r="1.3" fill="#1E293B" />
        <circle cx="10.4" cy="19.25" r="1.3" fill="#1E293B" />
        <circle cx="10.4" cy="12.75" r="1.3" fill="#1E293B" />
        <!-- Central Hub -->
        <circle cx="16" cy="16" r="4.2" fill="#0F172A" stroke="#475569" stroke-width="0.8" />
        <circle cx="16" cy="16" r="1.5" fill="#38BDF8" />
      </g>

      <!-- Ground Road Track & Lane Markings -->
      <line
        x1="-20"
        y1="130"
        x2="400"
        y2="130"
        stroke="rgba(56, 189, 248, 0.65)"
        stroke-width="1.4"
      />
      <line
        x1="-28"
        y1="138"
        x2="415"
        y2="138"
        stroke="rgba(148, 163, 184, 0.55)"
        stroke-width="2"
        stroke-dasharray="12, 10"
      />
    </svg>
